- name: Enviar mensaje de prueba a Make
  env:
    WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
  run: |
    curl --fail-with-body -sS -X POST "$WEBHOOK_URL" \
      -H "Content-Type: application/json" \
      --data-raw '{"command":"run","message":"Nueva publicación de prueba desde GitHub"}'

- name: Ejecutar la Inteligencia Artificial y Enviar a Make
  env:
    GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
  run: python bot.py
